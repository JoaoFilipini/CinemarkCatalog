services:
  mongodb:
    image: mongo:7.0
    container_name: cinemark-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: cinemark-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.8
    container_name: cinemark-localstack
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=0
    volumes:
      - "./scripts/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

  movie-catalog-api:
    image: movie-catalog-api:net9
    build:
      context: .
      dockerfile: src/Services/MovieCatalog/MovieCatalog.API/Dockerfile
    container_name: cinemark-movie-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://mongodb:27017
      - MongoDb__DatabaseName=CinemarkCatalogDb
      - Redis__ConnectionString=redis:6379
      - AWS__ServiceUrl=http://localstack:4566
      - AWS__Region=us-east-1
      - AWS__SqsQueueUrl=http://localstack:4566/000000000000/film-events
    depends_on:
      - mongodb
      - redis
      - localstack

  notification-consumer:
    image: notification-consumer:net9
    build:
      context: .
      dockerfile: src/Services/Notifications/NotificationConsumer.Service/Dockerfile
    container_name: cinemark-notification-worker
    environment:
      - AWS__ServiceUrl=http://localstack:4566
      - AWS__Region=us-east-1
      - AWS__SqsQueueUrl=http://localstack:4566/000000000000/film-events
    depends_on:
      - localstack

volumes:
  mongodb_data:
